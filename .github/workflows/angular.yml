name: CI & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Configure these in repo Settings → Secrets and variables → Actions.
  # SUPABASEKEY MUST be the anon public key, never the service_role key.
  SUPABASEURL: ${{ secrets.SUPABASEURL }}
  SUPABASEKEY: ${{ secrets.SUPABASEKEY }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  build:
    needs: quality
    runs-on: ubuntu-latest
    # Declares the environment so this job can read the `github-pages`
    # environment secrets (SUPABASEURL / SUPABASEKEY) at build time. Without
    # this, environment-scoped secrets are empty here and the bundle ships
    # with an empty Supabase config.
    environment: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate environment from secrets
        run: npm run config

      - name: Build for GitHub Pages
        run: npx ng build --configuration=gh-pages --base-href /musicosapp/

      - name: Copy index.html to 404.html for client-side routing
        run: cp dist/musicos/browser/index.html dist/musicos/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/musicos/browser

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
